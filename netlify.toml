# Netlify: Next.js 16 needs no plugin line (Netlify's OpenNext adapter is used automatically). This file only pins Node.
# Set the settings from .env.example under Site configuration > Environment variables (MONGODB_URI, ANTHROPIC_API_KEY,
# the SendGrid ones, and NEXT_PUBLIC_SITE_URL = the site's own address). On Netlify the visitor's address comes from
# x-nf-client-connection-ip by itself (lib/request.ts).
[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
