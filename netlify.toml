# Netlify: Next.js 16 needs no plugin line (Netlify's OpenNext adapter is used automatically). This file only pins Node.
# The only settings the site needs are the two in .env (MONGODB_URI and ANTHROPIC_API_KEY): add them under Site
# configuration > Environment variables ("Import from a .env file" does both at once). The site's own address (Netlify's
# URL, see next.config.ts) and the visitor's address (x-nf-client-connection-ip, see lib/request.ts) are worked out by the code.
[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
